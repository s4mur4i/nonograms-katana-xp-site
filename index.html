<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nonograms index</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#242a35; --text:#dbe2ef; --muted:#8a94a8; --accent:#6ea8fe; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { padding:14px 20px; border-bottom:1px solid var(--line); background:var(--panel); }
  h1 { font-size:16px; margin:0 0 10px; }
  .nav { display:flex; gap:8px; margin-bottom:8px; }
  .nav button { font:inherit; color:var(--text); background:#0d0f14; border:1px solid var(--line); border-radius:6px; padding:6px 12px; cursor:pointer; }
  .nav button.active { border-color:var(--accent); color:var(--accent); }
  .controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:6px; }
  input, select, button { font:inherit; color:var(--text); background:#0d0f14; border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
  input[type=search] { min-width:220px; }
  .controls label { color:var(--muted); font-size:12px; display:flex; gap:4px; align-items:center; }
  .banner { display:none; margin:8px 20px 0; padding:6px 10px; background:#16201c; border:1px solid var(--line); border-radius:6px; color:var(--muted); }
  .banner b { color:var(--text); }
  .banner button { margin-left:8px; }
  .stats { color:var(--muted); padding:10px 20px 0; }
  main { padding:0 20px 30px; }
  table { width:100%; border-collapse:collapse; margin-top:10px; }
  th, td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  tbody tr { cursor:pointer; }
  tbody tr:hover { background:#151923; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  a.author { color:var(--accent); cursor:pointer; }
  .tag { display:inline-block; padding:1px 6px; border-radius:4px; font-size:11px; background:#1c2330; color:var(--accent); }
  .tag.true { background:#12301f; color:#7ee2a8; }
  .tag.hard { background:#30120f; color:#e29a7e; }
  td.done-cell { text-align:center; padding:0; width:30px; }
  .done-check { width:16px; height:16px; cursor:pointer; accent-color:var(--accent); vertical-align:middle; }
  .done-badge { display:inline-block; margin-left:6px; padding:0 6px; border-radius:4px; font-size:11px; background:#12301f; color:#7ee2a8; }
  #done-controls { border-top:1px solid var(--line); margin-top:8px; padding-top:8px; }
  #done-note { color:var(--muted); font-size:12px; }
  #toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--panel); border:1px solid var(--accent); color:var(--text); padding:8px 14px; border-radius:8px; display:none; z-index:30; max-width:90vw; }
  .add-cell { text-align:center; width:34px; padding:0; }
  .add-btn { border:none; background:none; color:var(--accent); font-size:17px; cursor:pointer; padding:0 2px; line-height:1; }
  #cart-controls { border-top:1px solid var(--line); margin-top:8px; padding-top:8px; }
  #cart-panel { margin:8px 20px 0; padding:8px 12px; background:#10141c; border:1px solid var(--line); border-radius:8px; max-height:440px; overflow:auto; display:none; }
  #cart-panel .cart-item { display:flex; justify-content:space-between; gap:8px; padding:3px 0; border-bottom:1px solid var(--line); }
  #cart-panel .cart-item button { border:none; background:none; color:var(--muted); cursor:pointer; font-size:16px; }
  #cart-note { color:var(--muted); font-size:12px; }
  #more { margin:14px 0; width:100%; }
  #stats-view { display:none; margin-top:10px; }
  #credits-view { display:none; margin-top:10px; }
  #about-view { display:none; margin-top:10px; }
  #solver-view { display:none; margin-top:10px; }
  .solver-head { display:flex; gap:10px; align-items:center; margin-bottom:8px; }
  .srow { display:flex; align-items:center; gap:10px; padding:8px 10px; border-bottom:1px solid var(--line); max-width:900px; }
  .srow .sid { font-variant-numeric:tabular-nums; color:var(--muted); }
  .srow .sname { flex:1; }
  .srow .smeta { color:var(--muted); font-size:12px; }
  .srow .scopy { font:inherit; font-size:12px; padding:2px 8px; cursor:pointer; }
  #about-view h2 { font-size:15px; margin:18px 0 6px; }
  #about-view p, #about-view li { color:var(--muted); }
  #about-view b { color:var(--text); }
  #credits-view .cred { border:1px solid var(--line); border-radius:8px; padding:10px 14px; margin:10px 0; }
  #credits-view .cred h3 { margin:0; font-size:14px; }
  #credits-view .cred ul { list-style:none; margin:6px 0 0; padding:0; }
  #credits-view .cred li { display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px solid var(--line); max-width:420px; }
  #credits-view .cred li span:last-child { color:var(--muted); font-variant-numeric:tabular-nums; }
  #credits-view .tot { color:var(--muted); font-size:12px; margin-top:6px; }
  #stats-view .cols { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; }
  #stats-view h3 { font-size:13px; color:var(--muted); margin:14px 0 4px; text-transform:uppercase; letter-spacing:.04em; }
  #stats-view ul { list-style:none; margin:0; padding:0; }
  #stats-view li { display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px solid var(--line); }
  #stats-view li span:last-child { color:var(--muted); font-variant-numeric:tabular-nums; }
  #detail { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.6); z-index:10; }
  #detail.open { display:flex; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px 20px; max-width:460px; width:90%; max-height:82vh; overflow:auto; }
  .card h2 { margin:0 0 6px; font-size:17px; }
  .card .alt { color:var(--muted); margin-bottom:10px; }
  .card dl { display:grid; grid-template-columns:120px 1fr; gap:4px 10px; margin:0; }
  .card dt { color:var(--muted); }
  .card dd { margin:0; }
  .close { float:right; background:none; border:none; color:var(--muted); font-size:18px; }
  footer { color:var(--muted); padding:10px 20px 40px; border-top:1px solid var(--line); font-size:12px; }
  @media (max-width:720px) {
    header { position:static; }
    .controls { gap:6px; }
    input[type=search] { width:100%; min-width:0; }
    .table-wrap { overflow-x:auto; }
    th, td { padding:6px 8px; white-space:nowrap; }
    td.name { max-width:160px; overflow:hidden; text-overflow:ellipsis; }
    .card dl { grid-template-columns:100px 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>Nonograms Katana — index</h1>
  <div class="nav">
    <button id="nav-browse" class="active">Browse</button>
    <button id="nav-stats">Stats</button>
    <button id="nav-credits">Credits</button>
    <button id="nav-about">About</button>
    <button id="nav-solver">Solver</button>
  </div>
  <div id="browse-controls">
    <div class="controls">
      <input id="q" type="search" placeholder="Search id / name / author…">
      <label>size <select id="min"></select> – <select id="max"></select></label>
      <select id="color"><option value="">colour + B/W</option><option value="1">colour</option><option value="0">B/W</option></select>
      <label>colours <select id="cmin"></select> – <select id="cmax"></select></label>
      <select id="sort">
        <option value="id">newest first</option>
        <option value="area">largest</option>
        <option value="fill">most filled</option>
      </select>
    </div>
    <div class="controls">
      <label>XP <select id="xp">
        <option value="">any</option><option value="<3k">&lt;3k</option><option value="3-4k">3–4k</option>
        <option value="4-5k">4–5k</option><option value="5-6k">5–6k</option><option value="6k+">6k+</option>
        <option value="unknown">unknown</option>
      </select></label>
      <label>type <select id="type">
        <option value="">any</option>
        <option value="True Nonogram">True Nonogram</option>
        <option value="Few trivial lines">Few trivial lines</option>
        <option value="Contradictions method">Contradictions method</option>
        <option value="Symmetry (95%)">Symmetry (95%)</option>
        <option value="coloring">Coloring</option>
        <option value="Mosaic (small segments)">Mosaic</option>
        <option value="not marked">not marked</option>
      </select></label>
      <label>category <select id="cat"><option value="">any</option></select></label>
      <label>list <select id="list">
        <option value="">any</option>
        <option value="any-list">on a community list</option>
        <option value="191904">high-XP 3k+</option>
        <option value="238184">B/W &gt;2k</option>
        <option value="237942">second tier</option>
        <option value="187784">easy 60 MP</option>
        <option value="233518">easy 60 MP 2</option>
        <option value="187748">48 MP</option>
        <option value="191702">MP list</option>
        <option value="239132">list index</option>
        <option value="none">not on a list</option>
      </select></label>
      <label>wiki list <select id="wiki">
        <option value="">any</option>
        <option value="xpc">XP color (3k+)</option>
        <option value="xpbw">XP B/W (&gt;2k)</option>
        <option value="xpco25">XP color other (2.5–3k)</option>
        <option value="xpco0">XP color other (&lt;2.5k)</option>
        <option value="xpbwo">XP B/W other</option>
        <option value="mp60">Easy 60 MP</option>
        <option value="mpo">Easy other</option>
      </select></label>
      <button id="reset">reset</button>
    </div>
    <div class="controls" id="done-controls">
      <label>done <select id="done">
        <option value="">all</option><option value="hide">hide done</option><option value="only">done only</option>
      </select></label>
      <button id="export-done">export</button>
      <button id="import-btn">import</button>
      <input type="file" id="import-done" accept=".json,application/json" style="display:none">
      <span id="done-note"></span>
    </div>
    <div class="controls" id="cart-controls">
      <button id="cart-toggle">list (0)</button>
      <button id="cart-copy">copy (search)</button>
      <button id="cart-clear">clear</button>
      <select id="bulk">
        <option value="">add from list…</option>
        <optgroup label="community">
          <option value="191904">high-XP 3k+</option>
          <option value="238184">B/W &gt;2k</option>
          <option value="237942">second tier</option>
          <option value="187784">easy 60 MP</option>
          <option value="233518">easy 60 MP 2</option>
          <option value="187748">48 MP</option>
          <option value="191702">MP list</option>
        </optgroup>
        <optgroup label="wiki">
          <option value="xpc">XP color (3k+)</option>
          <option value="xpbw">XP B/W (&gt;2k)</option>
          <option value="xpco25">XP color other (2.5–3k)</option>
          <option value="xpco0">XP color other (&lt;2.5k)</option>
          <option value="xpbwo">XP B/W other</option>
          <option value="mp60">Easy 60 MP</option>
          <option value="mpo">Easy other</option>
        </optgroup>
      </select>
      <button id="bulk-add">add from list (not done)</button>
      <button id="bulk-matching">add all matching (not done)</button>
      <button id="cart-markdone">mark done</button>
      <span id="cart-note"></span>
    </div>
  </div>
</header>
<div class="banner" id="banner"></div>
<div id="cart-panel"></div>
<div class="stats" id="stats">loading…</div>
<main>
  <div id="browse-view">
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th class="done-cell">✓</th>
          <th>id</th><th>name</th><th>author</th><th>size</th>
          <th>type</th><th class="num">colors</th><th class="num">fill</th>
          <th class="add-cell">＋</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <button id="more" style="display:none">load more</button>
  </div>
  <div id="stats-view"></div>
  <div id="credits-view"></div>
  <div id="about-view"></div>
  <div id="solver-view">
    <div class="solver-head">
      <label>list <select id="solver-list">
        <option value="">pick a list…</option>
        <optgroup label="community">
          <option value="191904">high-XP 3k+</option>
          <option value="238184">B/W &gt;2k</option>
          <option value="237942">second tier</option>
          <option value="187784">easy 60 MP</option>
          <option value="233518">easy 60 MP 2</option>
          <option value="187748">48 MP</option>
          <option value="191702">MP list</option>
        </optgroup>
        <optgroup label="wiki">
          <option value="xpc">XP color (3k+)</option>
          <option value="xpbw">XP B/W (&gt;2k)</option>
          <option value="xpco25">XP color other (2.5–3k)</option>
          <option value="xpco0">XP color other (&lt;2.5k)</option>
          <option value="xpbwo">XP B/W other</option>
          <option value="mp60">Easy 60 MP</option>
          <option value="mpo">Easy other</option>
        </optgroup>
      </select></label>
      <span id="solver-remaining" style="color:var(--muted)"></span>
    </div>
    <div id="solver-rows"></div>
  </div>
</main>
<div id="detail"><div class="card">
  <button class="close" onclick="closeDetail()">×</button>
  <h2 id="d_name"></h2>
  <div class="alt" id="d_alt"></div>
  <p style="margin:2px 0 8px"><button id="d_copy">copy #id</button>
  <button id="d_done">mark done</button>
  <button id="d_cart">add to list</button>
  <span style="color:var(--muted);font-size:12px">paste into the app's search funnel</span></p>
  <dl id="d_fields"></dl>
</div></div>
<div id="toast"></div>
<footer>Metadata only — no solutions, clues or images are published. Sources: the app's own
catalogue; see docs/LEGAL.md.</footer>

<script src="https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js"></script>
<script>
let db = null, page = 0, view = 'browse', authorFilter = null;
let doneSet = new Set();
let doneMeta = { lastExportedCount: 0, lastExportedAt: null };
let cart = new Map();   // id -> name (list builder)
let toastT;
const PAGE = 200;
const SIZES = [40,45,50,55,60,65,70,75,80];
const TYPE_SHORT = { true:'true', hard:'hard', medi:'medi', symmetry:'sym', 'coloring-few':'col-few', 'coloring-lot':'col-lot', mosaic:'mosaic' };
const CAT_NAMES = {1:"Around",2:"Egypt",3:"Science",4:"Japan",5:"Kawaii",6:"Anime",7:"Cartoon",8:"Movies",9:"Video",10:"Flags",11:"Fantasy",12:"Fiction",13:"Super",14:"Unreal",15:"Dragons",16:"Adventures",17:"Ships",18:"Pirates",19:"Games",20:"Music",21:"Animals",22:"Birds",23:"Cats",24:"Dogs",25:"Fish",26:"Insects",27:"Plants",28:"Flowers",29:"People",30:"Painting",31:"Nature",32:"Houses",33:"Designs",34:"Photorealism",35:"Transport",36:"Space",37:"Twilight",38:"Love",39:"Smiles",40:"Holidays",41:"Symbols",43:"Horoscope",44:"Food",45:"Clothes",46:"Objects",47:"Machines",48:"Sport",49:"Weapons",50:"History"};
const WIKI_LISTS = {xpc:"XP color (3k+)",xpbw:"XP B/W (>2k)",xpco25:"XP color other (2.5–3k)",xpco0:"XP color other (<2.5k)",xpbwo:"XP B/W other",mp60:"Easy 60 MP",mpo:"Easy other"};

function fillOpts(sel, items, value) {
  items.forEach(([v, label]) => { const o = document.createElement('option'); o.value = v; o.textContent = label; if (String(v) === String(value)) o.selected = true; sel.appendChild(o); });
}
fillOpts(document.getElementById('min'), SIZES.map(s => [s, s + '×' + s]), 40);
fillOpts(document.getElementById('max'), SIZES.map(s => [s, s + '×' + s]), 80);
fillOpts(document.getElementById('cmin'), [['', 'any']].concat([...Array(12)].map((_,i) => [i+1, i+1])), '');
fillOpts(document.getElementById('cmax'), [['', 'any']].concat([...Array(12)].map((_,i) => [i+1, i+1])), '');
fillOpts(document.getElementById('cat'), [['', 'any']].concat(Object.keys(CAT_NAMES).sort((a,b)=>a-b).map(k => [k, k + ' · ' + CAT_NAMES[k]])), '');

initSqlJs({ locateFile: f => `https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/${f}` })
  .then(SQL => fetch('./public.db').then(r => r.arrayBuffer()).then(async buf => {
    db = new SQL.Database(new Uint8Array(buf));
    await loadDone();
    refresh();
  }))
  .catch(e => { document.getElementById('stats').textContent = 'failed to load: ' + e; });

function where() {
  const cond = [], p = [];
  const q = (document.getElementById('q').value || '').trim().toLowerCase();
  if (q) {
    if (/^\d+$/.test(q)) { cond.push("(search LIKE '%'||?||'%' OR CAST(id AS TEXT) LIKE '%'||?||'%')"); p.push(q, q); }
    else { cond.push("search LIKE '%'||?||'%'"); p.push(q); }
  }
  const mn = +document.getElementById('min').value, mx = +document.getElementById('max').value;
  cond.push("w >= ? AND h >= ?"); p.push(mn, mn);
  cond.push("w <= ? AND h <= ?"); p.push(mx, mx);
  const color = document.getElementById('color').value;
  if (color !== '') { cond.push("color = ?"); p.push(+color); }
  const cmin = document.getElementById('cmin').value, cmax = document.getElementById('cmax').value;
  if (cmin !== '') { cond.push("colors >= ?"); p.push(+cmin); }
  if (cmax !== '') { cond.push("colors <= ?"); p.push(+cmax); }
  const xp = document.getElementById('xp').value;
  if (xp === 'unknown') cond.push("xp_range IS NULL");
  else if (xp) { cond.push("xp_range = ?"); p.push(xp); }
  const type = document.getElementById('type').value;
  if (type === 'coloring') cond.push("type IN ('Coloring (few colors)','Coloring (many colors)')");
  else if (type) { cond.push("type = ?"); p.push(type); }
  const cat = document.getElementById('cat').value;
  if (cat) { cond.push("(cat1 = ? OR cat2 = ?)"); p.push(+cat, +cat); }
  const lst = document.getElementById('list').value;
  if (lst === 'any-list') cond.push("groups IS NOT NULL AND groups != ''");
  else if (lst === 'none') cond.push("(groups IS NULL OR groups = '')");
  else if (lst) { cond.push("(','||groups||',') LIKE '%,'||?||',%'"); p.push(lst); }
  const wiki = document.getElementById('wiki').value;
  if (wiki) { cond.push("(','||wiki_lists||',') LIKE '%,'||?||',%'"); p.push(wiki); }
  const done = document.getElementById('done').value;
  if (done === 'hide') cond.push("NOT EXISTS (SELECT 1 FROM done d WHERE d.id = puzzles.id)");
  else if (done === 'only') cond.push("EXISTS (SELECT 1 FROM done d WHERE d.id = puzzles.id)");
  if (authorFilter) { cond.push("author = ?"); p.push(authorFilter); }
  return { sql: 'WHERE ' + cond.join(' AND '), p };
}

function order() {
  const s = document.getElementById('sort').value;
  return { id:'id DESC', area:'area DESC, id DESC', fill:'fill_pct DESC, id DESC' }[s] || 'id DESC';
}
function query(sql, params) {
  const st = db.prepare(sql); st.bind(params); const rows = [];
  while (st.step()) rows.push(st.getAsObject()); st.free(); return rows;
}

function refresh() {
  if (view === 'stats') return renderStats();
  page = 0;
  document.getElementById('rows').innerHTML = '';
  const { sql, p } = where();
  const s = query(`SELECT COUNT(*) n,
        SUM(CASE WHEN color=1 THEN 1 ELSE 0 END) c,
        SUM(CASE WHEN color=0 THEN 1 ELSE 0 END) b,
        SUM(CASE WHEN color IS NULL THEN 1 ELSE 0 END) u
        FROM puzzles ${sql}`, p)[0];
  document.getElementById('stats').textContent =
    `${s.n.toLocaleString()} puzzles · ${s.c.toLocaleString()} colour · ${s.b.toLocaleString()} B/W · ${s.u.toLocaleString()} unknown · ${doneSet.size.toLocaleString()} done`;
  document.getElementById('banner').style.display = authorFilter ? 'block' : 'none';
  document.getElementById('banner').innerHTML =
    authorFilter ? `filtering by author <b>${esc(authorFilter)}</b> <button onclick="clearAuthor()">clear</button>` : '';
  render();
}

function typeCell(t) {
  if (!t || t === 'unknown') return '–';
  const label = TYPE_SHORT[t] || t;
  return label === 'true' ? `<span class="tag true">${label}</span>` : (label === 'hard' ? `<span class="tag hard">${label}</span>` : `<span class="tag">${label}</span>`);
}

function render() {
  const { sql, p } = where();
  const rows = query(`SELECT * FROM puzzles ${sql} ORDER BY ${order()} LIMIT ? OFFSET ?`, [...p, PAGE, page * PAGE]);
  const tbody = document.getElementById('rows');
  rows.forEach(r => {
    const tr = document.createElement('tr');
    tr.innerHTML =
      `<td class="done-cell"><input type="checkbox" class="done-check" ${doneSet.has(r.id) ? 'checked' : ''} onclick="event.stopPropagation(); toggleDone(${r.id})"></td>` +
      `<td class="num">${r.id}</td>` +
      `<td class="name">${esc(r.name)}${r.alt_name ? ` <span class="tag">${esc(r.alt_name)}</span>` : ''}${doneSet.has(r.id) ? ' <span class="done-badge">✓</span>' : ''}</td>` +
      `<td><a class="author" onclick="event.stopPropagation();filterAuthor('${escAttr(r.author)}')">${esc(r.author)}</a></td>` +
      `<td class="num">${r.w}×${r.h}</td>` +
      `<td>${typeCell(r.type)}</td>` +
      `<td class="num">${r.color == null ? '–' : r.colors}</td>` +
      `<td class="num">${r.fill_pct == null ? '–' : r.fill_pct.toFixed(1) + '%'}</td>` +
      `<td class="add-cell"><button class="add-btn" data-id="${r.id}" onclick="event.stopPropagation(); toggleCart(${r.id}, '${escAttr(r.name)}')">${cart.has(r.id) ? '−' : '＋'}</button></td>`;
    tr.onclick = () => openDetail(r);
    tbody.appendChild(tr);
  });
  document.getElementById('more').style.display = rows.length === PAGE ? 'block' : 'none';
  page++;
}

function filterAuthor(name) { authorFilter = name; refresh(); }
function clearAuthor() { authorFilter = null; refresh(); }

function renderStats() {
  const el = document.getElementById('stats-view');
  const q = (sql, p) => query(sql, p);
  const total = q(`SELECT COUNT(*) n FROM puzzles`)[0].n;
  const byBucket = q(`SELECT size_bucket k, COUNT(*) n FROM puzzles GROUP BY size_bucket ORDER BY MIN(w*h)`);
  const byType = q(`SELECT type k, COUNT(*) n FROM puzzles GROUP BY type ORDER BY n DESC`);
  const byColor = q(`SELECT color k, COUNT(*) n FROM puzzles GROUP BY color`);
  const byXp = q(`SELECT xp_range k, COUNT(*) n FROM puzzles WHERE xp_range IS NOT NULL GROUP BY xp_range ORDER BY n DESC`);
  const byCat = q(`SELECT cat1 k, COUNT(*) n FROM puzzles WHERE cat1 IS NOT NULL GROUP BY cat1 ORDER BY n DESC LIMIT 20`);
  const topAuthors = q(`SELECT author k, COUNT(*) n FROM puzzles GROUP BY author ORDER BY n DESC LIMIT 20`);

  const li = (arr, fmt) => arr.map(r => `<li><span>${fmt(r.k)}</span><span>${r.n.toLocaleString()}</span></li>`).join('');
  const bucketOrder = ['<=10','11-15','16-20','21-30','31-39','40-49','50-59','60-69','70-79','80'];
  byBucket.sort((a,b) => bucketOrder.indexOf(a.k) - bucketOrder.indexOf(b.k));
  const colorName = k => k === 1 ? 'colour' : (k === 0 ? 'B/W' : 'unknown');
  const typeName = k => (TYPE_SHORT[k] || k || 'unknown');

  el.innerHTML =
    `<h3>${total.toLocaleString()} puzzles in the catalogue</h3>` +
    `<div class="cols">` +
    `<div><h3>by size</h3><ul>${li(byBucket, k => k)}</ul></div>` +
    `<div><h3>by type</h3><ul>${li(byType, typeName)}</ul></div>` +
    `<div><h3>by colour</h3><ul>${li(byColor, colorName)}</ul></div>` +
    `<div><h3>by XP tier</h3><ul>${li(byXp, k => k)}</ul></div>` +
    `<div><h3>top categories</h3><ul>${li(byCat, k => (CAT_NAMES[k] || k))}</ul></div>` +
    `<div><h3>top authors</h3><ul>${li(topAuthors, k => k)}</ul></div>` +
    `</div>`;
  document.getElementById('stats').textContent = 'catalogue overview';
}

function xpEst(r) {
  // empirical estimate (area x colour-factor); exact XP needs the solver (see docs)
  if (r.color == null) return null;
  if (r.color === 0) return Math.round(r.area * 0.36);
  const k = Math.min(0.42 + 0.008 * (r.colors ?? 2), 0.51);
  return Math.round(r.area * k);
}

function openDetail(r) {
  document.getElementById('d_name').textContent = r.name;
  document.getElementById('d_alt').textContent = r.alt_name || '';
  const f = [
    ['id', r.id], ['size', `${r.w} × ${r.h}`], ['author', r.author],
    ['colour / B&W', r.color == null ? 'unknown' : (r.color ? 'colour' : 'black & white')],
    ['colours', r.colors ?? '—'], ['filled', r.fill_pct == null ? '—' : r.fill_pct.toFixed(1) + '%'],
    ['type', r.type || 'unknown'],
  ];
  if (r.xp_range) f.push(['xp range', r.xp_range]);
  const xp = xpEst(r);
  if (xp != null) f.push(['xp (estimate)', '~' + xp.toLocaleString() + ' (±40%)']);
  if (r.cat1 != null) f.push(['categories', [r.cat1, r.cat2].filter(x => x).map(x => CAT_NAMES[x] || x).join(', ')]);
  if (r.groups) f.push(['lists', r.groups]);
  if (r.wiki_lists) f.push(['wiki lists', r.wiki_lists.split(',').map(x => WIKI_LISTS[x] || x).join(', ')]);
  f.push(['last seen', fmt(r.last_seen)]);
  document.getElementById('d_copy').onclick = () => copyText('#' + r.id);
  document.getElementById('d_done').textContent = doneSet.has(r.id) ? 'unmark done' : 'mark done';
  document.getElementById('d_done').onclick = () => { toggleDone(r.id); closeDetail(); };
  document.getElementById('d_cart').textContent = cart.has(r.id) ? 'remove from list' : 'add to list';
  document.getElementById('d_cart').onclick = () => {
    toggleCart(r.id, r.name);
    document.getElementById('d_cart').textContent = cart.has(r.id) ? 'remove from list' : 'add to list';
  };
  document.getElementById('d_fields').innerHTML =
    f.map(([k, v]) => `<dt>${k}</dt><dd>${esc(String(v))}</dd>`).join('');
  document.getElementById('detail').classList.add('open');
}

// ---- done tracking (IndexedDB) ----
let idbPromise = null;
function openDB() {
  if (idbPromise) return idbPromise;
  idbPromise = new Promise((res, rej) => {
    const req = indexedDB.open('nk-done', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('kv');
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
  return idbPromise;
}
function kvGet(key) {
  return openDB().then(db => new Promise((res, rej) => {
    const t = db.transaction('kv').objectStore('kv').get(key);
    t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error);
  }));
}
function kvSet(key, val) {
  return openDB().then(db => new Promise((res, rej) => {
    const t = db.transaction('kv', 'readwrite').objectStore('kv').put(val, key);
    t.onsuccess = () => res(); t.onerror = () => rej(t.error);
  }));
}
async function loadDone() {
  try {
    const st = await kvGet('state');
    if (st && Array.isArray(st.done)) doneSet = new Set(st.done.map(Number).filter(Number.isInteger));
    if (st) doneMeta = { lastExportedCount: st.lastExportedCount || 0, lastExportedAt: st.lastExportedAt || null };
  } catch (e) {}
  syncDoneTable();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  updateDoneNote();
}
function persistDone() {
  return kvSet('state', { done: [...doneSet], lastExportedCount: doneMeta.lastExportedCount, lastExportedAt: doneMeta.lastExportedAt });
}
function syncDoneTable() {
  if (!db) return;
  db.run("CREATE TEMP TABLE IF NOT EXISTS done(id INTEGER PRIMARY KEY)");
  db.run("DELETE FROM done");
  const st = db.prepare("INSERT INTO done VALUES (?)");
  for (const id of doneSet) { st.bind([id]); st.step(); st.reset(); }
  st.free();
}
function toggleDone(id) {
  if (doneSet.has(id)) doneSet.delete(id); else doneSet.add(id);
  persistDone(); syncDoneTable(); updateDoneNote(); refresh();
}
function exportDone() {
  const payload = { version: 1, done: [...doneSet].sort((a, b) => a - b), exported_at: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'nonograms-done.json'; a.click();
  URL.revokeObjectURL(url);
  doneMeta.lastExportedCount = doneSet.size; doneMeta.lastExportedAt = Date.now();
  persistDone(); updateDoneNote(); toast('exported ' + doneSet.size + ' done puzzles');
}
function importDone(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      const ids = (Array.isArray(d.done) ? d.done : []).map(Number).filter(n => Number.isInteger(n) && n > 0);
      doneSet = new Set(ids);   // REPLACE: import is a full set
      doneMeta.lastExportedCount = ids.length; doneMeta.lastExportedAt = Date.now();
      persistDone(); syncDoneTable(); updateDoneNote(); refresh();
      toast('imported ' + doneSet.size + ' done (replaced)');
    } catch (e) { toast('import failed: ' + e.message); }
  };
  r.readAsText(file);
}
function updateDoneNote() {
  const el = document.getElementById('done-note');
  const unsaved = doneSet.size - doneMeta.lastExportedCount;
  let t = doneSet.size ? doneSet.size.toLocaleString() + ' done' : '';
  if (unsaved >= 20) t += (t ? ' · ' : '') + unsaved + ' unsaved — export your progress';
  el.textContent = t;
}
function toast(msg) {
  const el = document.getElementById('toast'); el.textContent = msg; el.style.display = 'block';
  clearTimeout(toastT); toastT = setTimeout(() => el.style.display = 'none', 2500);
}
document.getElementById('export-done').onclick = exportDone;
document.getElementById('import-btn').onclick = () => document.getElementById('import-done').click();
document.getElementById('import-done').addEventListener('change', e => {
  const f = e.target.files[0]; if (f) importDone(f); e.target.value = '';
});

// ---- list builder (cart) ----
function renderCart() {
  document.getElementById('cart-toggle').textContent = 'list (' + cart.size + ')';
  const items = [...cart.entries()].sort((a, b) => a[0] - b[0]);
  document.getElementById('cart-panel').innerHTML = items.length
    ? items.map(([id, name]) => `<div class="cart-item"><span>#${id} · ${esc(name)}</span><button onclick="removeFromCart(${id})">×</button></div>`).join('')
    : '<div style="color:var(--muted)">empty — click ＋ on any puzzle to add it</div>';
  document.getElementById('cart-note').textContent = cart.size ? cart.size + ' ids' : '';
}
function updateCartButtons() {
  document.querySelectorAll('.add-btn').forEach(b => {
    b.textContent = cart.has(+b.dataset.id) ? '−' : '＋';
  });
}
function toggleCart(id, name) {
  if (cart.has(id)) cart.delete(id); else cart.set(id, name);
  renderCart(); updateCartButtons();
}
function removeFromCart(id) { cart.delete(id); renderCart(); updateCartButtons(); }
function copySearchList() {
  if (!cart.size) { toast('list is empty'); return; }
  const text = [...cart.keys()].sort((a, b) => a - b).map(id => '#' + id).join(';');
  copyText(text);
  toast('copied ' + cart.size + ' ids (search filter format)');
}
function bulkAdd() {
  const val = document.getElementById('bulk').value;
  if (!val) { toast('pick a list first'); return; }
  const col = WIKI_LISTS[val] ? 'wiki_lists' : 'groups';
  const rows = query(`SELECT id, name FROM puzzles WHERE (','||${col}||',') LIKE '%,'||?||',%'`, [val]);
  let added = 0;
  for (const r of rows) {
    if (!doneSet.has(r.id) && !cart.has(r.id)) { cart.set(r.id, r.name); added++; }
  }
  renderCart(); updateCartButtons();
  toast('added ' + added + ' not-done puzzles');
}
function bulkAddMatching() {
  const { sql, p } = where();
  const rows = query(`SELECT id, name FROM puzzles ${sql}`, p);
  let added = 0;
  for (const r of rows) {
    if (!doneSet.has(r.id) && !cart.has(r.id)) { cart.set(r.id, r.name); added++; }
  }
  renderCart(); updateCartButtons();
  toast('added ' + added + ' not-done puzzles (matching filters)');
}
function markCartDone() {
  if (!cart.size) { toast('list is empty'); return; }
  let n = 0;
  for (const id of cart.keys()) {
    if (!doneSet.has(id)) { doneSet.add(id); n++; }
  }
  persistDone(); syncDoneTable(); updateDoneNote(); updateCartButtons(); refresh();
  toast('marked ' + n + ' done');
}
document.getElementById('cart-toggle').onclick = () => {
  const p = document.getElementById('cart-panel');
  p.style.display = p.style.display === 'block' ? 'none' : 'block';
};
document.getElementById('cart-copy').onclick = copySearchList;
document.getElementById('bulk-add').onclick = bulkAdd;
document.getElementById('bulk-matching').onclick = bulkAddMatching;
document.getElementById('cart-markdone').onclick = markCartDone;
document.getElementById('cart-clear').onclick = () => { cart.clear(); renderCart(); refresh(); };

// ---- solver (grind) ----
let solverQueue = [];
function selectSolverList() {
  const val = document.getElementById('solver-list').value;
  if (!val) { solverQueue = []; renderSolver(); return; }
  const col = WIKI_LISTS[val] ? 'wiki_lists' : 'groups';
  solverQueue = query(
    `SELECT id, name, w, h, type, area, color, colors FROM puzzles
     WHERE (','||${col}||',') LIKE '%,'||?||',%'
       AND NOT EXISTS (SELECT 1 FROM done d WHERE d.id = puzzles.id)
     ORDER BY id`, [val]);
  renderSolver();
}
function renderSolver() {
  const batch = solverQueue.slice(0, 10);
  document.getElementById('solver-remaining').textContent =
    solverQueue.length ? solverQueue.length + ' not done' : '';
  document.getElementById('solver-rows').innerHTML = batch.map(r => {
    const xp = xpEst(r);
    return `<div class="srow">
      <input type="checkbox" class="done-check" ${doneSet.has(r.id) ? 'checked' : ''} onchange="solverToggleDone(${r.id})">
      <button class="scopy" onclick="solverCopy(this, ${r.id})">copy</button>
      <span class="sid">#${r.id}</span>
      <span class="sname">${esc(r.name)}</span>
      <span class="smeta">${r.w}×${r.h} · ${esc(r.type)}${xp != null ? ' · ~' + xp.toLocaleString() + ' xp' : ''}</span>
    </div>`;
  }).join('') || '<div style="color:var(--muted);max-width:900px">all done 🎉 — pick another list</div>';
}
function solverToggleDone(id) {
  if (doneSet.has(id)) doneSet.delete(id); else doneSet.add(id);
  persistDone(); syncDoneTable(); updateDoneNote();
  solverQueue = solverQueue.filter(x => x.id !== id);
  renderSolver();
}
function solverCopy(btn, id) {
  copyText('#' + id);
  const old = btn.textContent;
  btn.textContent = 'copied';
  setTimeout(() => { btn.textContent = old; }, 1200);
}
document.getElementById('solver-list').addEventListener('change', selectSolverList);

function copyText(t) {
  if (navigator.clipboard) { navigator.clipboard.writeText(t); return; }
  const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch (e) {} document.body.removeChild(ta);
}
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function escAttr(s) { return esc(s).replace(/'/g, '&#39;'); }
function fmt(t) { return t ? new Date(t * 1000).toISOString().slice(0, 10) : '—'; }
function debounce(fn, ms) { let t; return () => { clearTimeout(t); t = setTimeout(fn, ms); }; }
